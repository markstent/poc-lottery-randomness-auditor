[project]
name = "poc-lottery-randomness-auditor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "altair>=6.3.0",
    "jinja2>=3.1.6",
    "marimo[mcp]>=0.25.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
    "vl-convert-python>=1.9.0.post1",
    "weasyprint>=70.0",
]

[project.scripts]
poc-lottery-randomness-auditor = "poc_lottery_randomness_auditor:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
exclude = ["docs/superpowers/plans/**"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff.lint.per-file-ignores]
# Marimo notebooks expose values by assignment and display the final expression.
"notebooks/*.py" = ["B018", "F401", "F841"]
